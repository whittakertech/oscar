name: CI

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Gitea-only: this job depends on postgres-hatchery, an internal Aerie
    # Docker-network service unreachable from GitHub's hosted runners.
    # github.server_url resolves to the Gitea instance's own internal URL
    # (http://gitea:3000) when running on the self-hosted Gitea Actions
    # runner, and to https://github.com on real GitHub Actions -- use that
    # to skip this job entirely on the GitHub mirror instead of letting it
    # fail loudly on an unreachable hostname.
    if: github.server_url != 'https://github.com'

    # No `services:` block: the self-hosted Gitea Actions runner attaches
    # per-job service containers to the shared `proxy` Docker network, which
    # also carries Aerie's always-on permanent `postgres` container under
    # that exact name — a same-alias DNS collision that intermittently
    # routes queries to production instead of an ephemeral CI container (hit
    # this on sesame's CI, 2026-07-12). Aerie already runs a long-lived,
    # disposable `postgres-hatchery` instance on `proxy` (uniquely named, no
    # collision risk, always up so no health-check race) — connect to that
    # directly instead of spinning up a per-job Postgres.
    env:
      DATABASE_HOST: postgres-hatchery
      DATABASE_USER: postgres
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Install postgresql-client (for structure.sql dumps)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client

      - name: Setup database
        run: |
          cd spec/dummy
          bundle exec rails db:drop db:create db:migrate

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      # Non-blocking: internal v0.1 engine, no shipped consumers yet. Findings
      # stay visible in every CI log; a dependency/Rails upgrade backlog is a
      # separate task, not folded into feature work.
      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
        continue-on-error: true

      - name: Run bundler-audit
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check
        continue-on-error: true

  github_ci:
    name: GitHub CI (shared)
    # Only runs on the public GitHub mirror -- the `test` job above already
    # covers Gitea (Postgres via postgres-hatchery). Gitea itself skips this
    # cleanly: the job-level `if:` is evaluated before Gitea would attempt
    # to resolve the cross-org `uses:` reference, so this doesn't hit the
    # "repository not found" failure a wrong/GitHub-style org slug would
    # (verified against WhittakerTech-org/midas's identical guard, which
    # shows `conclusion: skipped` on every Gitea run).
    if: github.server_url == 'https://github.com'
    uses: whittakertech/.github/.github/workflows/master-ci.yml@main
    with:
      postgres: true
      # No .yardopts/mkdocs.yml yet, and still internal/unpublished (see
      # CHANGELOG) -- RubyGems publish is a separate go/no-go decision, not
      # implied by mirroring to GitHub.
      docs_enabled: false
      release_enabled: false
    secrets: inherit
